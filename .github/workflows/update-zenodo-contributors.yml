name: Update .zenodo.json contributors

on:
  push:
    branches:
      - main
      - 315-include-a-metadata-file-for-the-repository
    paths:
      - '_data/CONTRIBUTORS.yml'
  workflow_dispatch:

jobs:
  update-zenodo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run consistency checks
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_zenodo_contributors.py --check-only

      - name: Update contributors in .zenodo.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_zenodo_contributors.py

      - name: Open PR with updated .zenodo.json
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: .zenodo.json
          branch: auto/update-zenodo-contributors
          commit-message: "chore: update .zenodo.json contributors from CONTRIBUTORS.yml"
          title: "Update .zenodo.json contributors"
          body: "Automated update generated from `_data/CONTRIBUTORS.yml`."
          delete-branch: true
